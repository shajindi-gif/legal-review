# 上海市规则包 — 上海市行政规范性文件合法性审核地方要求
# 硬约束：地方规则包上线前需法律专业人员审核；未核实字段留空（null）。
# 适用范围：上海市各级行政机关制定的行政规范性文件。

rules:
  - rule_id: SH-E-01
    dimension: E
    title: 上海市程序要求：公开征求意见与备案
    risk_type: 程序缺失（上海市要求）
    severity: high
    law_basis: 《上海市行政规范性文件管理规定》
    law_basis_article: null
    region: 上海市
    effective_date: null
    condition: 核查是否按上海市规定履行公开征求意见、合法性审核与备案程序。
    evidence_required:
      - 公开征求意见记录
      - 备案材料
    exception: 依上海市规定适用简化程序的情形（需说明理由）。
    source_url: null
    pending_fields:
      - law_basis_article
      - effective_date

