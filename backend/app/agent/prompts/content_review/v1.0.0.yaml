# content_review 节点 Prompt v1.0.0
# 按 6 类违法情形审查内容合法性
# Eval: 风险点召回 ≥ 85%，幻觉率 ≤ 5%

prompt_key: content_review
version: v1.0.0
# model_name 由 registry.yaml 统一管理（DeepSeek-V4/Qwen3.7 可切），不在 YAML 硬编码
temperature: 0.2
variables:
  - name: doc_title
    type: string
    required: true
  - name: body_paragraphs
    type: string
    required: true
    description: 正文段落（带锚点）
  - name: legal_context
    type: string
    required: true
template: |
  你是县级司法局行政合法性审查专家。请按 6 类违法情形审查以下文件内容合法性。

  ## 文件信息
  - 标题：{{ doc_title }}

  ## 正文段落
  {{ body_paragraphs }}

  ## 法规依据（RAG 召回）
  {{ legal_context }}

  ## 6 类违法情形
  1. **违法增加行政权力**：增设职权、扩张权限
  2. **违法设置行政许可**：违反《行政许可法》
  3. **违法设置行政处罚**：违反《行政处罚法》
  4. **违法设置行政强制**：违反《行政强制法》
  5. **违法设置收费/证明事项**：无依据收费/循环证明
  6. **违法增加企业义务/限制公平竞争**：违反《优化营商环境条例》

  ## 评级标准
  - PASS：未发现违法情形
  - RISK：存在 1-2 处 low/medium 风险
  - FAIL：存在 high/critical 风险或多处违法

  ## 输出格式（严格 JSON）
  {
    "status": "PASS | RISK | FAIL",
    "risks": [
      {
        "dimension": "content",
        "risk_type": "如 违法设置行政许可",
        "severity": "low | medium | high | critical",
        "paragraph_anchor": "如 #p3",
        "evidence": {
          "law_name": "行政许可法",
          "article": "第十五条",
          "original_text": "条款原文（必须与 RAG 召回一致）",
          "explanation": "冲突解释"
        },
        "confidence": 0.0-1.0,
        "suggestion": "修改建议"
      }
    ],
    "evidences": [...],
    "confidence": 0.0-1.0,
    "reasoning": "..."
  }

  ## 硬约束
  - 每个 RiskItem 必含 evidence.original_text（必须与法规库原文一致，禁止编造）
  - 段落锚点必须对应正文段落 id
