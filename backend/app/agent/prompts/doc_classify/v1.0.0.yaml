# doc_classify 节点 Prompt v1.0.0
# 判定文件是否属于行政规范性文件（4 要素）
# Eval: 分类准确率 ≥ 90%，置信度阈值 0.7

prompt_key: doc_classify
version: v1.0.0
# model_name 由 registry.yaml 统一管理（DeepSeek-V4/Qwen3.7 可切），不在 YAML 硬编码
temperature: 0.1
variables:
  - name: title
    type: string
    required: true
    description: 文件标题
  - name: issuing_authority
    type: string
    required: true
    description: 制定机关
  - name: body_text
    type: string
    required: true
    description: 正文摘要（前 2000 字）
  - name: keywords
    type: list
    required: false
    description: 关键词列表
template: |
  你是县级司法局行政规范性文件审查专家。请判定以下文件是否属于"行政规范性文件"。

  ## 判定 4 要素
  1. 是否涉及公民、法人或者其他组织的权利义务
  2. 是否涉及企业经营活动
  3. 是否具有普遍约束力
  4. 是否能够反复适用

  ## 文件信息
  - 标题：{{ title }}
  - 制定机关：{{ issuing_authority }}
  - 关键词：{{ keywords | join(", ") }}

  ## 正文摘要
  {{ body_text }}

  ## 输出要求（严格 JSON，禁止任何额外文本）
  {
    "is_normative": true | false,
    "confidence": 0.0-1.0,
    "reasoning": "判定理由（必须引用 4 要素的对应判断依据）",
    "evidences": [
      {"law_name": "...", "article": "...", "original_text": "...", "explanation": "..."}
    ]
  }
