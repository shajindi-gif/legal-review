# Nginx 配置 — legalai86.com.cn
#
# 部署方式：自建 VPS · Docker Compose
# 证书：Let's Encrypt (certbot webroot)
# 反代：
#   /api/*     -> backend:8000      (FastAPI / Uvicorn)
#   /          -> frontend:3081     (Next.js standalone)
#   /uploads/* -> backend:8000      (用户上传文件)
#   /sse/*     -> backend:8000      (Agent 节点流，长连接)
#
# 关键设计点：
#   1. 80 端口仅做 ACME 挑战 + 全 301 跳转 https
#   2. 443 端口 HTTP/2 + TLS 1.2/1.3 + HSTS
#   3. /api 反代开 SSE（X-Accel-Buffering: no + proxy_buffering off + 长 timeout）
#   4. Next.js 13+ 静态资源 /_next/static 走 1 年强缓存
#   5. Security headers 统一加（CSP 留给前端 _next/ 域，XFO 走 SAMEORIGIN 防 iframe 滥用）

# -------------------- 80 (HTTP) --------------------
server {
    listen 80;
    listen [::]:80;
    server_name legalai86.com.cn www.legalai86.com.cn;

    # Let's Encrypt 验证文件
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余全部 301 -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------- 443 (HTTPS) --------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legalai86.com.cn www.legalai86.com.cn;

    # ---------- TLS ----------
    # Let's Encrypt 默认路径（certbot 申请后位于 /etc/letsencrypt/live/<domain>/）
    ssl_certificate     /etc/letsencrypt/live/legalai86.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalai86.com.cn/privkey.pem;

    # 协议与算法（IE/老旧客户端不兼容，生产只保留现代）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # TLS 1.3 不再让 server 决定，让 client 选

    # 会话复用
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---------- Security Headers ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP 留前端 meta 控，nginx 不强制加（避免与 Next.js inline script 冲突）

    # ---------- Body Size ----------
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm;

    # ============================================================
    # 路径 0: /health -> FastAPI 后端（存活探针）
    # ============================================================
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ============================================================
    # 路径 1: /api/* -> FastAPI 后端
    # ============================================================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Header 转发
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # SSE / 长轮询关键：关 buffering
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;     # 11 节点 Agent 流水线最长可能跑 10 分钟
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # 强制不走缓存
        proxy_set_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ============================================================
    # 路径 2: /uploads/* -> 后端（用户上传文件直连）
    # ============================================================
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # 路径 3: /_next/static -> Next.js 静态资源（1 年强缓存）
    # ============================================================
    location /_next/static/ {
        proxy_pass http://frontend:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ============================================================
    # 路径 4: / -> Next.js 应用
    # ============================================================
    location / {
        proxy_pass http://frontend:3081;
        proxy_http_version 1.1;

        # WebSocket 兼容（即便现在没用，预留）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # ============================================================
    # 通用：隐藏 nginx 版本
    # ============================================================
    server_tokens off;
}
